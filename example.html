<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مثال — قصة يوسف | Amiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@500;700;900&family=Frank+Ruhl+Libre:wght@500;700;900&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --ink-deep:#12203A; --parchment:#F7F1E3; --parchment-warm:#F1E8D2;
    --gold:#C9A227; --gold-bright:#E3C158; --coral:#E4572E; --charcoal:#2B2118;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--parchment);color:var(--charcoal);font-family:'Noto Sans Arabic','Noto Sans',sans-serif;}
  [dir="rtl"] .display{font-family:'Amiri', serif;}
  [dir="ltr"][lang="en"] .display{font-family:'Playfair Display', serif;}
  [dir="rtl"][lang="he"] .display{font-family:'Frank Ruhl Libre', serif;}
  [lang="he"]{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;}
  [lang="en"]{font-family:'Noto Sans',sans-serif;}

  header{display:flex;justify-content:space-between;align-items:center;padding:24px 6vw;}
  .logo{font-size:1.5rem;font-weight:700;color:var(--ink);}
  .logo span{color:var(--gold);}
  .lang-switch{display:flex;gap:6px;background:rgba(27,42,74,0.06);border-radius:999px;padding:4px;}
  .lang-switch button{
    border:none;background:transparent;padding:8px 16px;border-radius:999px;
    font-size:0.85rem;font-weight:600;color:var(--ink);cursor:pointer;transition:all 0.25s ease;font-family:inherit;
  }
  .lang-switch button.active{background:var(--ink);color:var(--parchment);}

  .wrap{max-width:640px;margin:0 auto;padding:10px 6vw 90px;}
  .badge{
    display:block;text-align:center;font-size:0.78rem;font-weight:700;color:var(--gold);
    letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;
  }
  h1{font-family:'Amiri',serif;font-size:1.8rem;color:var(--ink);text-align:center;margin-bottom:8px;}
  .lead{color:#5A5142;font-size:0.95rem;text-align:center;margin-bottom:36px;}

  .book{background:var(--ink-deep);border-radius:20px;padding:10px;box-shadow:0 24px 50px rgba(27,42,74,0.3);}
  .book-page{
    background:var(--parchment-warm);border-radius:12px;padding:34px 24px;
    min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;
  }
  .page-title{font-family:'Amiri',serif;font-size:1.25rem;color:var(--ink);margin-bottom:14px;}
  .page-text{font-size:1.1rem;line-height:1.95;color:var(--charcoal);}
  .book-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 6px 4px;}
  .book-nav button{
    background:var(--gold);color:var(--ink-deep);border:none;width:42px;height:42px;
    border-radius:50%;font-size:1.2rem;font-weight:700;cursor:pointer;
  }
  .book-nav button:disabled{opacity:0.3;cursor:default;}
  .book-dots{display:flex;gap:6px;}
  .book-dots span{width:8px;height:8px;border-radius:50%;background:rgba(247,241,227,0.3);}
  .book-dots span.active{background:var(--gold-bright);}

  .proof{
    margin-top:44px;padding:24px;background:#fff;border:1px solid rgba(27,42,74,0.08);
    border-radius:16px;text-align:center;
  }
  .proof p{font-size:0.95rem;color:#5A5142;line-height:1.8;}
  .stars{color:var(--gold);font-size:1.1rem;margin-bottom:10px;}

  .final-cta{margin-top:40px;text-align:center;}
  .final-cta h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--ink);margin-bottom:12px;}
  .final-cta p{color:#5A5142;font-size:0.95rem;margin-bottom:26px;}
  .btn-primary{
    background:var(--coral);color:#fff;border:none;padding:17px 46px;border-radius:8px;
    font-size:1.08rem;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 24px rgba(228,87,46,0.35);transition:transform 0.2s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);}
</style>
</head>
<body>

<header>
  <div class="logo" data-i18n="logo">أميري <span>Amiri</span></div>
  <div class="lang-switch">
    <button data-lang="ar" class="active">عربي</button>
    <button data-lang="en">EN</button>
    <button data-lang="he">עברית</button>
  </div>
</header>

<div class="wrap">
  <span class="badge" data-i18n="badge">مثال حقيقي</span>
  <h1 data-i18n="page-heading">هيك بتبدو قصة طفلك</h1>
  <p class="lead" data-i18n="page-lead">هاي قصة حقيقية اتكتبت ليوسف، عمره ٧ سنين، وهواياته الفضاء والديناصورات.</p>

  <div class="book">
    <div class="book-page">
      <div class="page-title" id="pageTitle"></div>
      <div class="page-text" id="pageText"></div>
    </div>
    <div class="book-nav">
      <button id="prevBtn">‹</button>
      <div class="book-dots" id="dots"></div>
      <button id="nextBtn">›</button>
    </div>
  </div>

  <div class="proof">
    <div class="stars">★★★★★</div>
    <p data-i18n="testimonial">"ابني ضل يطلب نقرالها كل ليلة قبل النوم لمدة أسبوع كامل. أول مرة بشوف اسمه بطل قصة حقيقية."</p>
  </div>

  <div class="final-cta">
    <h2 data-i18n="cta-heading">دور طفلك جاهز يصير بطل؟</h2>
    <p data-i18n="cta-lead">اكتب تفاصيله هلق، واستلم قصته الكاملة بأقل من ٥ دقايق.</p>
    <button class="btn-primary" data-i18n="cta-btn" onclick="window.location.href='story.html'">أنشئ قصة طفلك الآن</button>
  </div>
</div>

<script>
const sampleData = {
  ar: {
    logo: 'أميري <span>Amiri</span>',
    badge: 'مثال حقيقي',
    'page-heading': 'هيك بتبدو قصة طفلك',
    'page-lead': 'هاي قصة حقيقية اتكتبت ليوسف، عمره ٧ سنين، وهواياته الفضاء والديناصورات.',
    testimonial: '"ابني ضل يطلب نقرالها كل ليلة قبل النوم لمدة أسبوع كامل. أول مرة بشوف اسمه بطل قصة حقيقية."',
    'cta-heading': 'دور طفلك جاهز يصير بطل؟',
    'cta-lead': 'اكتب تفاصيله هلق، واستلم قصته الكاملة بأقل من ٥ دقايق.',
    'cta-btn': 'أنشئ قصة طفلك الآن',
    title: 'يوسف ومركبة النجوم الضائعة',
    pages: [
      'كان في ولد اسمه يوسف، بيحب يتفرج عالنجوم كل ليلة من شباك غرفته، وبيحلم إنه يصير رائد فضاء.',
      'بليلة من الليالي، شاف نجمة صغيرة عم تلمع بشكل غريب — كانت مركبة فضائية صغيرة، وواقعة بين الأشجار!',
      '"ساعدني!" قالت المركبة بصوت رقيق. "ضعت طريقي للبيت، وبطاريتي خلصت." يوسف ما تردد لحظة.',
      'فكّر يوسف بذكاء، وتذكّر إنه قرا مرة عن الديناصورات وكيف كانت تتنفس هواء مليان طاقة قبل ملايين السنين!',
      'جمع يوسف أوراق شجر لامعة وحطها حوالين المركبة، وفجأة بلشت تشع ضوء ذهبي وطارت بأمان نحو النجوم.',
      '"شكرًا يا بطل!" صرخت المركبة وهي بتبعد. من هديك الليلة، صار يوسف يعرف إنه الشجاعة والذكاء بيقدروا يوصلوك لأي مكان — حتى للنجوم.'
    ]
  },
  en: {
    logo: 'Amiri <span>أميري</span>',
    badge: 'Real Example',
    'page-heading': "This is what your child's story looks like",
    'page-lead': "A real story written for Youssef, age 7, who loves space and dinosaurs.",
    testimonial: '"My son asked me to read it every night for a whole week. First time he saw his own name as the hero of a real story."',
    'cta-heading': 'Is your child ready to become a hero?',
    'cta-lead': "Fill in their details now, and get their full story in under 5 minutes.",
    'cta-btn': "Create Your Child's Story Now",
    title: "Youssef and the Lost Starship",
    pages: [
      "There was a boy named Youssef who loved watching the stars every night from his window, dreaming of becoming an astronaut.",
      "One night, he saw a strange, tiny light glowing near the trees — it was a little spaceship, stuck and lost!",
      '"Help me!" said the ship in a soft voice. "I lost my way home, and my power is almost gone." Youssef didn\'t hesitate.',
      "Youssef thought hard, remembering how ancient dinosaurs once breathed air full of ancient starlight energy.",
      "He gathered glowing leaves and placed them around the ship — suddenly it lit up gold and flew safely toward the stars.",
      '"Thank you, hero!" the ship called as it soared away. From that night on, Youssef knew that courage and cleverness could take you anywhere — even to the stars.'
    ]
  },
  he: {
    logo: 'אמירי <span>Amiri</span>',
    badge: 'דוגמה אמיתית',
    'page-heading': 'כך ייראה הסיפור של הילד שלכם',
    'page-lead': 'סיפור אמיתי שנכתב עבור יוסף, בן 7, שאוהב חלל ודינוזאורים.',
    testimonial: '"הבן שלי ביקש שאקרא לו את זה כל ערב במשך שבוע שלם. בפעם הראשונה הוא ראה את השם שלו כגיבור של סיפור אמיתי."',
    'cta-heading': 'הילד שלכם מוכן להיות גיבור?',
    'cta-lead': 'מלאו את הפרטים שלו עכשיו, וקבלו את הסיפור המלא תוך פחות מ-5 דקות.',
    'cta-btn': 'צרו את הסיפור של הילד שלכם עכשיו',
    title: 'יוסף וספינת הכוכבים האבודה',
    pages: [
      'היה פעם ילד בשם יוסף, שאהב להביט בכוכבים כל ערב מהחלון שלו, וחלם להיות אסטרונאוט.',
      'לילה אחד הוא ראה אור קטן ומוזר נוצץ ליד העצים — זו הייתה ספינת חלל קטנה, תקועה ואבודה!',
      '"עזור לי!" אמרה הספינה בקול רך. "איבדתי את הדרך הביתה, והסוללה שלי כמעט נגמרה." יוסף לא היסס לרגע.',
      'יוסף חשב בחכמה, ונזכר שדינוזאורים קדומים נשמו פעם אוויר מלא באנרגיית כוכבים עתיקה.',
      'הוא אסף עלים נוצצים והניח אותם סביב הספינה — לפתע היא זהרה בזהב והמריאה בבטחה לעבר הכוכבים.',
      '"תודה, גיבור!" קראה הספינה בעודה מתרחקת. מאותו לילה, יוסף ידע שאומץ וחוכמה יכולים לקחת אותך לכל מקום — אפילו לכוכבים.'
    ]
  }
};

let currentLang = 'ar';
let currentPage = 0;

function renderPage(){
  const data = sampleData[currentLang];
  const total = data.pages.length;
  document.getElementById('pageTitle').textContent = currentPage === 0 ? data.title : `${data.title} — ${currentPage + 1}/${total}`;
  document.getElementById('pageText').textContent = data.pages[currentPage];
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === total - 1;

  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  for(let i = 0; i < total; i++){
    const dot = document.createElement('span');
    if(i === currentPage) dot.classList.add('active');
    dots.appendChild(dot);
  }
}

function setLang(lang){
  currentLang = lang;
  currentPage = 0;
  const dir = lang === 'en' ? 'ltr' : 'rtl';
  document.documentElement.lang = lang;
  document.documentElement.dir = dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(sampleData[lang][key]) el.innerHTML = sampleData[lang][key];
  });
  document.querySelectorAll('.lang-switch button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  renderPage();
}

document.querySelectorAll('.lang-switch button').forEach(btn=>{
  btn.addEventListener('click', ()=> setLang(btn.dataset.lang));
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentPage > 0){ currentPage--; renderPage(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentPage < sampleData[currentLang].pages.length - 1){ currentPage++; renderPage(); }
});

renderPage();
</script>

</body>
</html>
